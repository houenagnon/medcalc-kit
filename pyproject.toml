[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medcalc-kit"
version = "0.5.0"
description = "Data, executable calculators and diagnostic probes (extraction, formula knowledge, substitution, arithmetic) for MedCalc-Bench"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "medcalc-kit authors" }]
keywords = ["medical calculation", "LLM evaluation", "MedCalc-Bench", "benchmark", "diagnostic probes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.2",
    "datasets>=2.18",
    "huggingface_hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/houenagnon/medcalc-kit"
Documentation = "https://github.com/houenagnon/medcalc-kit/blob/main/docs/guide.md"
Changelog = "https://github.com/houenagnon/medcalc-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/houenagnon/medcalc-kit/issues"

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.56"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the Hugging Face Hub (dataset download)", "gpu: needs a CUDA GPU"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "B905", "UP007"]  # zip() lengths are equal by construction; Union alias kept readable
